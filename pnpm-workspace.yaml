# The repository root is the published package, @hussmartinez/learn-sdk, as in
# the family's standard layout. The examples and the end-to-end suite join the
# workspace when they're added.

# One version of each tool for the whole workspace. Packages refer to these
# with `catalog:`, and pnpm writes the real ranges into published manifests.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@biomejs/biome": ^2.6.5
  "@commitlint/cli": ^21.2.4
  "@hussmartinez/sdk-config": ^0.7.0
  "@hussmartinez/sdk-core": ^0.4.3
  "@hussmartinez/ui": ^0.7.0
  axe-core: ^4.11.0
  "@microsoft/api-extractor": ^7.60.1
  "@size-limit/file": ^14.3.0
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/browser-playwright": 5.1.0
  dependency-cruiser: ^18.7.2
  fast-check: ^4.10.2
  husky: ^9.1.7
  lint-staged: ^17.6.0
  playwright: ^1.64.1
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  secretlint: ^13.1.0
  size-limit: ^14.3.0
  stylelint: ^18.0.0
  # Exact: the spaced-repetition engine, upgraded only with a state migration (ADR 0004).
  ts-fsrs: 6.0.0
  typescript: ^6.0.3
  vite: ^8.3.6
  vitest: ^5.1.0
  # Exact: a native binary, upgraded deliberately with its test.
  workerd: 1.20261112.1

# Supply-chain hardening (ADR 0012).
# Dependency install scripts are blocked unless allowlisted here.
allowBuilds:
  # workerd (dev only, for the Workers-runtime test) ships a postinstall that
  # copies its platform binary into place or downloads it from the npm
  # registry. Denied: the binary comes from the pinned optional dependency
  # @cloudflare/workerd-<platform>, which workerd's main module resolves at
  # run time, so nothing is downloaded or run at install.
  workerd: false
# Fail the install when an unapproved package wants to run a build script.
strictDepBuilds: true
# Don't resolve versions published less than a day ago.
minimumReleaseAge: 1440
# Family packages are adopted only after the reviewer checks the published
# tarball, so they skip the delay (sdk-core ADR 0044).
minimumReleaseAgeExclude:
  - "@hussmartinez/*"
# Refuse a version with weaker publish provenance than an earlier one.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true
