name: Feature request
description: Suggest an exercise type, a tool, an API or another improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `@hussmartinez/learn-sdk` makes no network requests and keeps learners' data with the host application, so features that need a server belong in the host, which plugs in through the SDK's ports ([ADR 0012](https://github.com/ie-huss-martinez/sdk-core/blob/main/docs/adr/0012-hostile-input-and-no-network.md)). Anything shared by several SDKs belongs in [`sdk-core`](https://github.com/ie-huss-martinez/sdk-core) or [`ui`](https://github.com/ie-huss-martinez/ui).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work, ideally with an example of the API you'd like to use. For an exercise type, include how it's answered with the keyboard and by tapping, and how it's graded. For a tool, how it works with the keyboard and how it's undone.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this hasn't been suggested yet.
          required: true
        - label: I checked that this doesn't contradict STANDARDS.md or an accepted ADR, or I explain why it should change.
          required: true
